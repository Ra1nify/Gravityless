name: update-changelog

# Regenerates the `info` branch from release tags: update.json, one changelog per release,
# and a changelog-index.json fallback. The client reads only those static files, so it never
# needs a new build when the download source or repository changes.
#
# Tag format is the version code: yyMM + major + minor, e.g. 261102.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (yyMMAB). Defaults to the newest tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    # Pre-releases never reach users, so they are not part of the manifest chain.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full tag history is required to build the chain
          fetch-tags: true

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${TAG_INPUT:-}" ]; then
            TAG="$TAG_INPUT"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git tag --sort=-creatordate | head -1)"
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "HEAD" ]; then
            echo "::error::no tag resolved"
            exit 1
          fi

          # The tag doubles as the version code, so it must be a positive integer.
          if ! [[ "$TAG" =~ ^[0-9]+$ ]] || [ "$TAG" -le 0 ]; then
            echo "::error::tag '$TAG' is not a positive integer"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          # A manifest pointing at a missing asset is the failure mode that silently breaks
          # every client, so the assets are confirmed before the manifest is published.
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "Assets for $TAG:"
          echo "$ASSETS" | sed 's/^/  /'

          for ARCH in x64 arm64; do
            if ! echo "$ASSETS" | grep -q "Gravityless-.*-${ARCH}\.exe"; then
              echo "::error::missing $ARCH installer in release $TAG"
              exit 1
            fi
          done

          if ! echo "$ASSETS" | grep -q '\.sha512$'; then
            echo "::warning::no .sha512 asset; the manifest will omit hashes"
          fi

      - name: Build info branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          BASE="https://raw.githubusercontent.com/${GH_REPO}/info"
          WORK="/tmp/info"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          # Tags sorted ascending by version code; the code is numeric so sort -n is correct.
          mapfile -t TAGS < <(git tag | grep -E '^[0-9]+$' | sort -n)

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "::error::no numeric tags found"
            exit 1
          fi

          echo "Tag chain: ${TAGS[*]}"

          # --- one changelog per release, linked to its neighbour --------------------
          PREV=""
          for T in "${TAGS[@]}"; do
            DATE="$(git log -1 --format=%aI "$T" 2>/dev/null | cut -d'T' -f1)"
            [ -z "$DATE" ] && DATE="$(date -u +%Y-%m-%d)"

            # Commits introduced by this tag, oldest first.
            if [ -n "$PREV" ]; then
              RANGE="${PREV}..${T}"
            else
              RANGE="${T}"
            fi

            # -z separates records with NUL so a body never bleeds into the next hash.
            git log --reverse -z --format='%H%x1f%s%x1f%b' "$RANGE" 2>/dev/null \
              | jq -R -s '
                  split("\u0000")
                  | map(select(length > 0))
                  | map(split("\u001f")
                        | { hash: .[0], title: (.[1] // ""), body: (.[2] // "") })
                  | map(. + {
                      type: (
                        (.title | capture("^(?<t>[a-z]+)(\\(.+\\))?!?:").t)
                        // ""
                      )
                    })
                ' > "/tmp/_commits.json"

            PREV_URL=""
            [ -n "$PREV" ] && PREV_URL="${BASE}/changelog-${PREV}.json"

            jq -n \
              --arg code "$T" \
              --arg name "$T" \
              --arg date "$DATE" \
              --arg prev "$PREV_URL" \
              --slurpfile entries /tmp/_commits.json \
              '{
                version_code: ($code | tonumber),
                version_name: $name,
                date: $date,
                previous_changelog: (if $prev == "" then null else $prev end),
                next_changelog: null,
                entries: $entries[0]
              }' > "$WORK/changelog-${T}.json"

            echo "  changelog-${T}.json  ${#TAGS[@]}(chain)  commits=$(jq 'length' /tmp/_commits.json)"

            PREV="$T"
          done

          # --- backfill next_changelog ------------------------------------------------
          # Runs over the whole chain: with the info branch already holding the previous
          # files, rewriting is cheap and keeps the link correct even if a run was missed.
          for i in "${!TAGS[@]}"; do
            T="${TAGS[$i]}"
            NEXT_IDX=$((i + 1))
            if [ "$NEXT_IDX" -lt "${#TAGS[@]}" ]; then
              NEXT="${TAGS[$NEXT_IDX]}"
              NEXT_URL="${BASE}/changelog-${NEXT}.json"
            else
              NEXT_URL=""
            fi

            if [ -z "$NEXT_URL" ]; then continue; fi

            jq --arg next "$NEXT_URL" '.next_changelog = $next' \
              "$WORK/changelog-${T}.json" > /tmp/_next.json
            mv /tmp/_next.json "$WORK/changelog-${T}.json"
          done

          # --- update.json ------------------------------------------------------------
          ASSETS_JSON="["
          FIRST=1
          for ARCH in x64 arm64; do
            ASSET="$(gh release view "$TAG" --json assets \
              --jq ".assets[] | select(.name | test(\"-${ARCH}\\\\.exe$\")) | .name" | head -1)"
            if [ -z "$ASSET" ]; then
              echo "::error::no $ARCH installer for $TAG"
              exit 1
            fi

            SIZE="$(gh release view "$TAG" --json assets \
              --jq ".assets[] | select(.name == \"$ASSET\") | .size")"

            SHA="$(gh release view "$TAG" --json assets \
              --jq ".assets[] | select(.name == \"${ASSET}.sha512\") | .name" | head -1)"
            [ -z "$SHA" ] && SHA=""

            [ $FIRST -eq 0 ] && ASSETS_JSON+=","
            FIRST=0
            ASSETS_JSON+="{\"arch\":\"${ARCH}\",\"url\":\"https://github.com/${GH_REPO}/releases/download/${TAG}/${ASSET}\",\"size\":${SIZE}}"
          done
          ASSETS_JSON+="]"

          # Attach hashes by fetching the .sha512 assets when present.
          if echo "$ASSETS_JSON" | grep -q '"url"'; then
            for ARCH in x64 arm64; do
              ASSET="$(gh release view "$TAG" --json assets \
                --jq ".assets[] | select(.name | test(\"-${ARCH}\\\\.exe$\")) | .name" | head -1)"
              SHA_NAME="${ASSET}.sha512"
              HASH="$(gh release download "$TAG" --pattern "$SHA_NAME" --dir /tmp/sha --clobber 2>/dev/null \
                && cut -d' ' -f1 "/tmp/sha/${SHA_NAME}" 2>/dev/null || true)"
              if [ -n "$HASH" ]; then
                ASSETS_JSON="$(echo "$ASSETS_JSON" | jq --arg arch "$ARCH" --arg sha "$HASH" \
                  'map(if .arch == $arch then . + {sha512: $sha} else . end)')"
              fi
            done
          fi

          jq -n \
            --arg code "$TAG" \
            --arg name "$TAG" \
            --arg changelog "${BASE}/changelog-${TAG}.json" \
            --argjson assets "$ASSETS_JSON" \
            '{
              version_code: ($code | tonumber),
              version_name: $name,
              assets: $assets,
              changelog_url: $changelog,
              latest_changelog: $changelog
            }' > "$WORK/update.json"

          # --- changelog-index.json ---------------------------------------------------
          # Neutral fallback: if a link is ever broken, the client can still enumerate.
          jq -n --argjson codes "$(printf '%s\n' "${TAGS[@]}" | jq -R -s 'split("\n") | map(select(length>0)) | map(tonumber)')" \
            '{ codes: $codes, latest: ($codes | last) }' > "$WORK/changelog-index.json"

          echo
          echo "Generated:"
          ls -1 "$WORK" | sed 's/^/  /'
          echo
          echo "update.json:"
          cat "$WORK/update.json"

      - name: Publish info branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          cd /tmp/info
          git init -q -b info
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -q -m "info: ${TAG}"

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            info:info

          echo "Published."
