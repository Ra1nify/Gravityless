name: update-changelog

# Regenerates the `info` branch from release tags: update.json and one changelog per release.
# The client reads only those static files, so it never needs a new build when the download
# source or repository changes.
#
# Tag format is the version code: yyMM + major + minor, e.g. 261102. Every run rebuilds the
# whole chain and force-pushes the branch, so a missed or repeated run leaves no damage.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (yyMMAB). Defaults to the newest tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    # Pre-releases never reach users, so they are not part of the manifest chain.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full tag history is required to build the chain
          fetch-tags: true

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${TAG_INPUT:-}" ]; then
            TAG="$TAG_INPUT"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git tag --sort=-creatordate | head -1)"
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "HEAD" ]; then
            echo "::error::no tag resolved"
            exit 1
          fi

          # The tag doubles as the version code, so it must be a positive integer.
          if ! [[ "$TAG" =~ ^[0-9]+$ ]] || [ "$TAG" -le 0 ]; then
            echo "::error::tag '$TAG' is not a positive integer"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          # A manifest pointing at a missing asset is the failure mode that silently breaks
          # every client, so the assets are confirmed before the manifest is published.
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "Assets for $TAG:"
          echo "$ASSETS" | sed 's/^/  /'

          for ARCH in x64 arm64; do
            if ! echo "$ASSETS" | grep -q "Gravityless-.*-${ARCH}\.exe"; then
              echo "::error::missing $ARCH installer in release $TAG"
              exit 1
            fi
          done

      - name: Build info branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          BASE="https://raw.githubusercontent.com/${GH_REPO}/info"
          WORK="/tmp/info"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          # Tags sorted ascending by version code; the code is numeric so sort -n is correct.
          mapfile -t TAGS < <(git tag | grep -E '^[0-9]+$' | sort -n)

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "::error::no numeric tags found"
            exit 1
          fi

          echo "Tag chain: ${TAGS[*]}"

          # --- one changelog per release, linked to its neighbour --------------------
          PREV=""
          for T in "${TAGS[@]}"; do
            DATE="$(git log -1 --format=%aI "$T" 2>/dev/null | cut -d'T' -f1)"
            [ -z "$DATE" ] && DATE="$(date -u +%Y-%m-%d)"

            # Commits introduced by this tag, oldest first.
            if [ -n "$PREV" ]; then
              RANGE="${PREV}..${T}"
            else
              RANGE="${T}"
            fi

            # -z separates records with NUL so a body never bleeds into the next hash.
            git log --reverse -z --format='%H%x1f%s%x1f%b' "$RANGE" 2>/dev/null \
              | jq -R -s '
                  split("\u0000")
                  | map(select(length > 0))
                  | map(split("\u001f")
                        | { hash: .[0], title: (.[1] // ""), body: (.[2] // "") })
                  | map(. + {
                      type: (
                        (.title | capture("^(?<t>[a-z]+)(\\(.+\\))?!?:").t)
                        // ""
                      )
                    })
                ' > "/tmp/_commits.json"

            PREV_URL=""
            [ -n "$PREV" ] && PREV_URL="${BASE}/changelog-${PREV}.json"

            # Tag layout is fixed: 2-digit year, 2-digit month, then major and minor.
            YY="${T:0:2}"; MM="${T:2:2}"; MAJ="${T:4:1}"; MIN="${T:5:1}"
            DISPLAY="${YY}.${MM}.${MAJ}.${MIN}"

            jq -n \
              --arg code "$T" \
              --arg ver "$DISPLAY" \
              --arg date "$DATE" \
              --arg prev "$PREV_URL" \
              --slurpfile entries /tmp/_commits.json \
              '{
                version_code: ($code | tonumber),
                version: $ver,
                date: $date,
                previous_changelog: (if $prev == "" then null else $prev end),
                next_changelog: null,
                entries: $entries[0]
              }' > "$WORK/changelog-${T}.json"

            echo "  changelog-${T}.json  ${#TAGS[@]}(chain)  commits=$(jq 'length' /tmp/_commits.json)"

            PREV="$T"
          done

          # --- backfill next_changelog ------------------------------------------------
          # Runs over the whole chain: with the info branch already holding the previous
          # files, rewriting is cheap and keeps the link correct even if a run was missed.
          for i in "${!TAGS[@]}"; do
            T="${TAGS[$i]}"
            NEXT_IDX=$((i + 1))
            if [ "$NEXT_IDX" -lt "${#TAGS[@]}" ]; then
              NEXT="${TAGS[$NEXT_IDX]}"
              NEXT_URL="${BASE}/changelog-${NEXT}.json"
            else
              NEXT_URL=""
            fi

            if [ -z "$NEXT_URL" ]; then continue; fi

            jq --arg next "$NEXT_URL" '.next_changelog = $next' \
              "$WORK/changelog-${T}.json" > /tmp/_next.json
            mv /tmp/_next.json "$WORK/changelog-${T}.json"
          done

          # --- update.json ------------------------------------------------------------
          # One query for the asset list; the size comes from the same response so the
          # manifest cannot describe a file that was replaced between calls.
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"' > /tmp/_assets.tsv

          ASSETS_JSON="["
          FIRST=1
          for ARCH in x64 arm64; do
            ASSET="$(awk -F'\t' -v a="-${ARCH}.exe" '$1 ~ /^Gravityless-.*\.exe$/ && index($1, a) == length($1) - length(a) + 1 { print $1; exit }' /tmp/_assets.tsv)"

            if [ -z "$ASSET" ]; then
              echo "::error::no $ARCH installer found for $TAG"
              exit 1
            fi

            SIZE="$(awk -F'\t' -v n="$ASSET" '$1 == n { print $2; exit }' /tmp/_assets.tsv)"

            [ $FIRST -eq 0 ] && ASSETS_JSON+=","
            FIRST=0
            ASSETS_JSON+="{\"arch\":\"${ARCH}\",\"url\":\"https://github.com/${GH_REPO}/releases/download/${TAG}/${ASSET}\",\"size\":${SIZE:-0}}"
          done
          ASSETS_JSON+="]"

          # Same fixed layout as the tag split above.
          YY="${TAG:0:2}"; MM="${TAG:2:2}"; MAJ="${TAG:4:1}"; MIN="${TAG:5:1}"
          DISPLAY="${YY}.${MM}.${MAJ}.${MIN}"

          jq -n \
            --arg code "$TAG" \
            --arg ver "$DISPLAY" \
            --arg changelog "${BASE}/changelog-${TAG}.json" \
            --argjson assets "$ASSETS_JSON" \
            '{
              version_code: ($code | tonumber),
              version: $ver,
              assets: $assets,
              changelog_url: $changelog,
              latest_changelog: $changelog
            }' > "$WORK/update.json"

          echo

          echo "Generated:"
          ls -1 "$WORK" | sed 's/^/  /'
          echo
          echo "update.json:"
          cat "$WORK/update.json"

      - name: Publish info branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          cd /tmp/info
          git init -q -b info
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -q -m "info: ${TAG}"

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            info:info

          echo "Published."
