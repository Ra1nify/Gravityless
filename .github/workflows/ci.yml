name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        required: true
        type: choice
        options: [all, x64, arm64]
        default: all
  workflow_call:
    inputs:
      version:
        description: Exact release version (optional, calculated if omitted)
        required: false
        type: string
        default: ''
      arch:
        description: Target architecture (all, x64, arm64)
        required: false
        type: string
        default: all
      sign:
        description: Sign the app exe and installer
        required: false
        type: boolean
        default: false
      upload:
        description: Upload installer as workflow artifact
        required: false
        type: boolean
        default: true
    secrets:
      GRAVITYLESS_PFX_BASE64:
        required: false
      GRAVITYLESS_PFX_PASSWORD:
        required: false
      GRAVITYLESS_PRIVATE_KEY:
        required: false
      GRAVITYLESS_CERT_PUBLIC:
        required: false
    outputs:
      version:
        description: Resolved build version
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch remote tags
        shell: pwsh
        run: |
          git fetch --tags --force

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          $explicitVersion = "${{ inputs.version }}"
          if ($explicitVersion) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$explicitVersion"
            Write-Host "Using explicitly provided version: $explicitVersion"
          } else {
            .\scripts\get-version.ps1 -ForCI
          }

      - name: Determine Architecture Matrix
        id: arches
        shell: pwsh
        run: |
          switch ("${{ inputs.arch }}") {
            'x64'   { Add-Content -Path $env:GITHUB_OUTPUT -Value 'arches=["x64"]' }
            'arm64' { Add-Content -Path $env:GITHUB_OUTPUT -Value 'arches=["arm64"]' }
            default { Add-Content -Path $env:GITHUB_OUTPUT -Value 'arches=["x64","arm64"]' }
          }

  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arches) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build and Package
        shell: pwsh
        env:
          GRAVITYLESS_PFX_BASE64: ${{ secrets.GRAVITYLESS_PFX_BASE64 }}
          GRAVITYLESS_PFX_PASSWORD: ${{ secrets.GRAVITYLESS_PFX_PASSWORD }}
          GRAVITYLESS_PRIVATE_KEY: ${{ secrets.GRAVITYLESS_PRIVATE_KEY }}
          GRAVITYLESS_CERT_PUBLIC: ${{ secrets.GRAVITYLESS_CERT_PUBLIC }}
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          $sign = "${{ inputs.sign }}"
          Write-Host "Running .\build.ps1 -Arch '$arch' -Version '$ver' (Sign=$sign)"
          if ($sign -eq 'true') {
            .\build.ps1 -Arch $arch -Version $ver -Sign
          } else {
            .\build.ps1 -Arch $arch -Version $ver
          }

      - name: Verify Installers
        shell: pwsh
        run: |
          $installers = Get-ChildItem artifacts\installer\Gravityless-*.exe
          if (-not $installers) {
            Write-Error "No installer built under artifacts\installer!"
            exit 1
          }
          Write-Host "Build verified. Generated installers:"
          foreach ($file in $installers) {
            $sizeMb = [math]::Round($file.Length / 1MB, 2)
            Write-Host "  - $($file.Name) ($sizeMb MB)"
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: gravityless-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          path: artifacts/installer/Gravityless-*-${{ matrix.arch }}.exe
          retention-days: 30
