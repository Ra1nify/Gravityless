name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        required: true
        type: choice
        options: [all, x64, arm64]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch remote tags
        shell: pwsh
        run: |
          git fetch --tags --force

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          .\scripts\get-version.ps1 -ForCI

      - name: Determine Architecture Matrix
        id: arches
        shell: pwsh
        run: |
          switch ("${{ inputs.arch }}") {
            'x64'   { Add-Content -Path $env:GITHUB_OUTPUT -Value 'arches=["x64"]' }
            'arm64' { Add-Content -Path $env:GITHUB_OUTPUT -Value 'arches=["arm64"]' }
            default { Add-Content -Path $env:GITHUB_OUTPUT -Value 'arches=["x64","arm64"]' }
          }

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arches) }}
    uses: ./.github/workflows/build-installer.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch: ${{ matrix.arch }}
      sign: false
      upload: true
