name: Publish

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        required: true
        type: choice
        options: [all, x64, arm64]
        default: all

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Validate branch
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            Write-Error 'Publish workflow can only run on the main branch.'
            exit 1
          }

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      arch: ${{ inputs.arch }}
      sign: true
      upload: true
    secrets: inherit

  release:
    needs: ci
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gravityless-${{ needs.ci.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.ci.outputs.version }}"
          $previousTag = $(git describe --tags --abbrev=0 2>$null)
          $range = "HEAD"
          if ($previousTag) {
            $range = "$previousTag..HEAD"
          }
          $notes = $(git log --no-merges --pretty='- %s' $range | Select-Object -First 30) -join "`n"
          if (-not $notes) {
            $notes = "Maintenance release $version."
          }

          $files = Get-ChildItem dist\*.exe | Select-Object -ExpandProperty FullName
          if (-not $files) {
            Write-Error "No installer binaries found in dist folder to attach to release!"
            exit 1
          }

          Write-Host "Creating release $version with assets: $($files -join ', ')"
          gh release create "$version" $files --title "v$version" --notes "$notes"
